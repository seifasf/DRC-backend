# Render Blueprint: https://render.com/docs/blueprint-spec
# First deploy: you will be prompted for MONGO_URI (sync: false). JWT_SECRET is auto-generated.

services:
  - type: web
    name: drc-lab-api
    runtime: node
    region: frankfurt
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://drc-system.vercel.app
      - key: JWT_EXPIRES_IN
        value: 45d
      # Optional: "1" = allow https://*.vercel.app (Preview deploys)
      # - key: CORS_ALLOW_VERCEL_PREVIEWS
      #   value: "1"
